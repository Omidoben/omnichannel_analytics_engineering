version: 2

models:
  - name: dim_channels
    description: Conformed channel dimension, one row per channel, shared by both fact tables
    config:
      materialized: table
    columns:
      - name: sk_channel
        description: Surrogate key of the channel dimension
        tests:
          - unique
          - not_null

  - name: dim_products
    description: Product dimension, one row per product, used only by fct_purchase_history.
    config:
      materialized: table
    columns:
      - name: sk_product
        description: Surrogate key of the products dimension
        tests:
          - unique
          - not_null

  - name: dim_customers
    description: Conformed customer dimension — one row per customer, shared by both fact tables.
    config:
      materialized: table
    columns:
      - name: sk_customer
        description: Surrogate key of the customers table
        tests:
          - unique
          - not_null
      - name: dsc_customer_segment
        description: >
          Derived segment (VIP/Regular/Occasional/One-time/No Purchases),
          sourced from int_customer_segments. Resolves the Customer Segment
          Mix KPI gap flagged in charter Section 7.5.
        tests:
          - not_null
          - accepted_values:
              values:
                ["VIP", "Regular", "Occasional", "One-time", "No Purchases"]

  - name: dim_date
    description: Conformed date dimension, generated via dbt_date for 2022-01-01 to 2024-12-31, matching the project's data window.
    config:
      materialized: table
    columns:
      - name: date_day
        tests:
          - unique
          - not_null

  - name: fct_purchase_history
    description: >
      Transaction-grain sales fact — one row per purchase line item, joined
      to dim_customers, dim_channels, and dim_products. Answers the sales
      tracking business process.
    config:
      materialized: table
    columns:
      - name: sk_customer
        description: Surrogate key for the customer dimension.
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: sk_customer
      - name: sk_channel
        description: Surrogate key for the channel dimension.
        tests:
          - not_null
          - relationships:
              to: ref('dim_channels')
              field: sk_channel
      - name: sk_product
        description: Surrogate key for the product dimension.
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: sk_product
      - name: mtr_total_amount_net
        tests:
          - not_null

  - name: fct_visit_history
    description: >
      Visit-grain engagement fact, one row per customer visit to a channel,
      joined to dim_customers and dim_channels. Answers the website/app
      performance business process. flg_is_bounce is true when
      bounce_timestamp is null (no further engagement recorded).
    config:
      materialized: table
    columns:
      - name: sk_customer
        description: Surrogate key for the customer dimension.
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: sk_customer
      - name: sk_channel
        description: Surrogate key for the channel dimension.
        tests:
          - not_null
          - relationships:
              to: ref('dim_channels')
              field: sk_channel
      - name: flg_converted
        description: >
          True if the same customer purchased on the same channel on the
          same calendar day as this visit (best-effort proxy, no shared
          transaction key exists between visits and purchases). Resolves
          the Visit-to-Purchase Conversion Rate KPI gap flagged in charter
          Section 7.5.
        tests:
          - not_null
